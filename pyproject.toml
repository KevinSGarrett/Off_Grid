[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "offgrid-commercial-intelligence"
version = "0.17.0"
description = "Evidence-backed commercial intelligence engine for the Off Grid Innovation interview project."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.18,<2",
  "uvicorn>=0.48,<1",
  "PyMuPDF>=1.26,<2",
  "pdfplumber>=0.11,<1",
  "rapidfuzz>=3.14,<4",
  "PyYAML>=6,<7",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
ai = [
  "openai>=2,<3"
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests", "apps/api/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
