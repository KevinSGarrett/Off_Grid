      - signal: new_construction
        points: 10
      - signal: multi_phase
        points: 5
      - signal: temporary_lighting_need_confirmed
        points: 45
      - signal: portable_lighting_need_confirmed
        points: 25
    validation_gate:
      context_signals: [site_activity_context, new_construction, multi_phase]
      need_signals: [temporary_lighting_need_confirmed]
      confirmation_signals: [portable_lighting_need_confirmed]
      not_indicated_status: NOT_INDICATED
      unconfirmed_status: UNVERIFIED_APPLICABILITY
      confirmed_status: SUPPORTED_CANDIDATE
      validated_status: CONFIRMED_FIT
      until_any_signal:
        - portable_lighting_need_confirmed
        - temporary_lighting_need_confirmed
    required_evidence:
      - key: portable_lighting_need_confirmed
        label: Distributed/portable lighting requirement
      - key: night_work_confirmed
        label: Night-work / after-dark operating requirement
      - key: existing_lighting_arrangement_identified
        label: Existing lighting arrangement and supplier

  - code: KVP
    name: KVP
    approved_facts:
      - statement: Mobile sodium-ion battery energy storage system on a trailer.
        classification: EXPLICIT
        source: employer_assignment
    unknown_specifications:
      - energy_capacity
      - power_rating
      - runtime
      - pricing
      - application_envelope
      - quantity_required
      - savings_or_roi
    fit_rules:
      - signal: site_activity_context
