name: CI

on:
  pull_request:
    branches: [main, codex/offgrid-public-snapshot]
  push:
    branches: [main, codex/offgrid-public-snapshot]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install policy parser
        run: python -m pip install "PyYAML>=6,<7"
      - name: Validate GitHub configuration
        run: python scripts/validate_github_config.py
      - name: Validate durable public and runtime naming
        run: python scripts/validate_public_runtime_naming.py
      - name: Validate tracked-file privacy boundary
        run: python scripts/validate_git_privacy.py --require-git
      - name: Audit public demo-seed and tracked-file rationale
        run: python scripts/audit_public_data_boundary.py --output public-data-boundary-audit.json

  backend-test-matrix:
    name: Backend Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Python compile gate
        run: python -m compileall -q apps/api scripts tests
      - name: Run public-safe backend test matrix
        run: python scripts/run_public_test_matrix.py

  backend-static-quality:
    name: Backend Static Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Record static-analysis tool versions
        run: |
          ruff --version
          mypy --version
      - name: Ruff focused application/control-plane lint
        run: ruff check apps/api/app/main.py apps/api/app/core apps/api/app/resilience.py apps/api/app/observability scripts/validate_github_config.py scripts/validate_git_privacy.py
      - name: Mypy focused application boundary
        run: mypy --ignore-missing-imports --follow-imports=skip apps/api/app/main.py apps/api/app/core apps/api/app/resilience.py apps/api/app/observability

  dependency-secret-scan:
    name: Dependency and Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit Python runtime dependencies
        shell: bash
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          .audit-venv/bin/python -m pip install --disable-pip-version-check . "pip-audit==2.10.1"
          .audit-venv/bin/python -m pip uninstall -y offgrid-commercial-intelligence
          .audit-venv/bin/python -m pip_audit --local --strict --progress-spinner off
      - name: Audit frontend production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  golden-regression:
    name: Golden Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Run sanitized deployment-seed golden contract
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q
          tests/unit/test_wave17_integration.py::test_wave17_deployment_seed_contains_integrated_golden_truth

  frontend-type-build:
    name: Frontend Typecheck and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Production build
        working-directory: apps/web
        run: npm run build

  docker-readiness:
    name: Docker Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build container when Dockerfile exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Dockerfile ]]; then
            docker build -t offgrid-commercial-intelligence:ci .
          elif [[ -f docker/Dockerfile ]]; then
            docker build -f docker/Dockerfile -t offgrid-commercial-intelligence:ci .
          else
            echo "Docker build is an explicit release gate and requires current container evidence."
          fi
