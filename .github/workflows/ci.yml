name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install policy parser
        run: python -m pip install "PyYAML>=6,<7"
      - name: Validate GitHub configuration
        run: python scripts/validate_github_config.py
      - name: Validate tracked-file privacy boundary
        run: python scripts/validate_git_privacy.py --require-git

  backend-test-matrix:
    name: Backend Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Python compile gate
        run: python -m compileall -q apps/api scripts tests
      - name: Run public-safe backend test matrix
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q
          tests/contract/test_wave14_observability_contract.py::test_structured_log_is_json_correlated_and_redacted
          tests/contract/test_wave14_observability_contract.py::test_sanitizer_masks_nested_secret_and_contact_values
          tests/load/test_wave14_synthetic_scale.py
          tests/unit/test_wave03_state_machines.py
          tests/unit/test_wave03_write_policy.py
          tests/unit/test_wave04_migration.py
          tests/unit/test_wave04_models.py
          tests/unit/test_wave04_privacy.py
          tests/unit/test_wave04_provenance.py
          tests/unit/test_wave05_sanitized_fixtures.py
          tests/unit/test_wave06_configuration.py
          tests/unit/test_wave06_migration.py
          tests/unit/test_wave07_migration.py
          tests/unit/test_wave08_apollo.py
          tests/unit/test_wave08_configuration.py
          tests/unit/test_wave11_openai.py
          tests/unit/test_wave13_frontend_contract.py
          tests/unit/test_wave14_resilience.py
          tests/unit/test_wave15_github.py
          tests/unit/test_wave16_aws.py
          tests/unit/test_wave17_integration.py
          --deselect=tests/unit/test_wave08_configuration.py::test_public_research_snapshot_records_no_prospect_outreach_or_live_apollo
          --deselect=tests/unit/test_wave11_openai.py::test_wave11_official_api_verification_record_exists
          --deselect=tests/unit/test_wave16_aws.py::test_cost_model_matches_documented_fixed_subtotal

  backend-static-quality:
    name: Backend Static Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff focused application/control-plane lint
        run: ruff check apps/api/app/main.py apps/api/app/core apps/api/app/resilience apps/api/app/observability scripts/validate_github_config.py scripts/validate_git_privacy.py
      - name: Mypy focused application boundary (advisory until clean Wave 17 type gate)
        continue-on-error: true
        run: mypy --ignore-missing-imports --follow-imports=skip apps/api/app/main.py apps/api/app/core apps/api/app/resilience apps/api/app/observability

  golden-regression:
    name: Golden Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Run sanitized deployment-seed golden contract
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q
          tests/unit/test_wave17_integration.py::test_wave17_deployment_seed_contains_integrated_golden_truth

  frontend-type-build:
    name: Frontend Typecheck and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Production build
        working-directory: apps/web
        run: npm run build

  docker-readiness:
    name: Docker Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build container when Dockerfile exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Dockerfile ]]; then
            docker build -t offgrid-commercial-intelligence:ci .
          elif [[ -f docker/Dockerfile ]]; then
            docker build -f docker/Dockerfile -t offgrid-commercial-intelligence:ci .
          else
            echo "Docker build is an explicit Wave 17 release gate; no Dockerfile is claimed in Wave 15."
          fi
