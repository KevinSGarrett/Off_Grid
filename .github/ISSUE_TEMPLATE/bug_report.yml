name: Bug report
description: Report a reproducible defect or regression.
title: "bug: "
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the defect and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe reproduction steps. Do not paste private PDFs, PII, or secrets.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation evidence
      description: Test name, run ID, sanitized log excerpt, or screenshot reference.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, raw licensed source material, and unnecessary contact PII.
          required: true
