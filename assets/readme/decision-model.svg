<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Commercial fit and data confidence are separate dimensions</title>
  <desc id="desc">Two score cards show strong commercial fit and moderate data confidence leading to a pursue and verify recommendation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07150f"/><stop offset="1" stop-color="#103823"/></linearGradient>
    <linearGradient id="green"><stop stop-color="#67f58e"/><stop offset="1" stop-color="#10b95b"/></linearGradient>
    <linearGradient id="amber"><stop stop-color="#ffd769"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <rect width="1440" height="360" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="70" y="72" fill="#8ab09a" font-size="14" font-weight="700" letter-spacing="2">A DECISION MODEL THAT SHOWS ITS WORK</text>
    <text x="70" y="118" fill="#ffffff" font-size="34" font-weight="800">Different questions. Separate signals.</text>
    <text x="70" y="154" fill="#abc2b4" font-size="17">An attractive opportunity can still contain weak or incomplete evidence.</text>
    <g transform="translate(70 196)">
      <rect width="330" height="104" rx="18" fill="#0c2b1e" stroke="#2d6548"/>
      <text x="24" y="32" fill="#9cb6a7" font-size="13" font-weight="700">COMMERCIAL FIT</text>
      <text x="24" y="80" fill="#ffffff" font-size="42" font-weight="800">80</text><text x="82" y="80" fill="#6ff18f" font-size="15" font-weight="700">STRONG</text>
      <rect x="166" y="54" width="134" height="8" rx="4" fill="#183c2b"/><rect x="166" y="54" width="107" height="8" rx="4" fill="url(#green)"/>
    </g>
    <text x="426" y="254" fill="#5bec83" font-size="34" font-weight="800">≠</text>
    <g transform="translate(482 196)">
      <rect width="330" height="104" rx="18" fill="#0c2b1e" stroke="#2d6548"/>
      <text x="24" y="32" fill="#9cb6a7" font-size="13" font-weight="700">DATA CONFIDENCE</text>
      <text x="24" y="80" fill="#ffffff" font-size="42" font-weight="800">69.25</text><text x="300" y="80" text-anchor="end" fill="#ffc857" font-size="15" font-weight="700">VERIFY</text>
      <rect x="24" y="90" width="276" height="7" rx="4" fill="#183c2b"/><rect x="24" y="90" width="191" height="7" rx="4" fill="url(#amber)"/>
    </g>
    <g transform="translate(930 64)">
      <rect width="420" height="236" rx="22" fill="#07140f" stroke="#3c7556"/>
      <text x="32" y="44" fill="#8dab99" font-size="13" font-weight="700" letter-spacing="1.5">STAFFORD DECISION</text>
      <text x="32" y="92" fill="#ffffff" font-size="34" font-weight="800">PURSUE / VERIFY</text>
      <line x1="32" y1="115" x2="388" y2="115" stroke="#214c35"/>
      <circle cx="49" cy="151" r="13" fill="#123d29" stroke="#5eed82"/><path d="m43 151 4 4 8-9" fill="none" stroke="#69f18c" stroke-width="2.5" stroke-linecap="round"/>
      <text x="74" y="156" fill="#c9dbd0" font-size="15">Recommendation survives without $7.5B</text>
      <circle cx="49" cy="190" r="13" fill="#3a2b0d" stroke="#ffbf42"/><path d="M49 182v10M49 197v1" stroke="#ffd66b" stroke-width="2.5" stroke-linecap="round"/>
      <text x="74" y="195" fill="#c9dbd0" font-size="15">Authority remains unresolved</text>
      <rect x="32" y="211" width="150" height="8" rx="4" fill="url(#green)"/><rect x="189" y="211" width="99" height="8" rx="4" fill="url(#amber)"/>
    </g>
  </g>
</svg>
