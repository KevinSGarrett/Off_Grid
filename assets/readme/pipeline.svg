  <g fill="#6bea8e"><path d="m271 143 14 7-14 7z"/><path d="m497 143 14 7-14 7z"/><path d="m723 143 14 7-14 7z"/><path d="m949 143 14 7-14 7z"/><path d="m1175 143 14 7-14 7z"/></g>
