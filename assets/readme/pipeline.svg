<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="310" viewBox="0 0 1440 310" role="img" aria-labelledby="title desc">
  <title id="title">Off Grid evidence-aware commercial pipeline</title>
  <desc id="desc">Six connected stages from source records through trust and qualification to CRM readiness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07140f"/><stop offset="1" stop-color="#0e2d1e"/></linearGradient>
    <linearGradient id="node" x1="0" x2="1"><stop stop-color="#0b3a25"/><stop offset="1" stop-color="#125331"/></linearGradient>
  </defs>
  <rect width="1440" height="310" rx="28" fill="url(#bg)"/>
  <text x="720" y="43" text-anchor="middle" fill="#86ad97" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" letter-spacing="2.5">SOURCE → EVIDENCE → JUDGMENT → ACTION</text>
  <path d="M155 150H1285" stroke="#2d6748" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
