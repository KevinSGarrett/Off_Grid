      <text y="84" fill="#ffffff" font-size="16" font-weight="800">SOURCE</text><text y="106" fill="#9fbaaa" font-size="12">project records</text>
    </g>
    <g transform="translate(381 150)">
      <circle r="53" fill="url(#node)" stroke="#42d477" stroke-width="3"/><path d="M0-26 23-16v17c0 15-10 24-23 30C-13 25-23 16-23 1v-17Z" fill="none" stroke="#8ff3a8" stroke-width="3"/><path d="m-10 1 7 7 14-17" fill="none" stroke="#8ff3a8" stroke-width="3" stroke-linecap="round"/>
      <text y="84" fill="#ffffff" font-size="16" font-weight="800">TRUST</text><text y="106" fill="#9fbaaa" font-size="12">provenance + quality</text>
    </g>
    <g transform="translate(607 150)">
      <circle r="53" fill="url(#node)" stroke="#42d477" stroke-width="3"/><circle r="24" fill="none" stroke="#8ff3a8" stroke-width="3"/><path d="M0-34v10M0 24v10M-34 0h10M24 0h10M-8 3l6 6 13-17" fill="none" stroke="#8ff3a8" stroke-width="3" stroke-linecap="round"/>
      <text y="84" fill="#ffffff" font-size="16" font-weight="800">QUALIFY</text><text y="106" fill="#9fbaaa" font-size="12">fit + product signal</text>
    </g>
    <g transform="translate(833 150)">
      <circle r="53" fill="url(#node)" stroke="#42d477" stroke-width="3"/><circle cx="-11" cy="-9" r="11" fill="none" stroke="#8ff3a8" stroke-width="3"/><path d="M-30 24c3-16 12-23 19-23S5 8 8 24M14-9h17M22-17v17" fill="none" stroke="#8ff3a8" stroke-width="3" stroke-linecap="round"/>
      <text y="84" fill="#ffffff" font-size="16" font-weight="800">RESOLVE</text><text y="106" fill="#9fbaaa" font-size="12">account + contact</text>
    </g>
    <g transform="translate(1059 150)">
